# Settings for the Low Republic wiki build (WIKI-SITE/build.py).
# Safe to edit by hand. Article titles must match the `title` in the article exactly.

site_name: The Low Republic
# The path the site is served from: "/" for https://thelowrepublic.github.io/. Only the
# not-found page uses it, because it is shown at whatever address was missing.
site_path: /
footer: >-
  The Low Republic is a fan-made alternate universe of Star Wars, written by Pablito and Hyerodrimm.
  Star Wars and all related names are the property of Lucasfilm and Disney. This is a non-commercial
  fan project. Artwork belongs to the artists credited beside it.

# Links at the top of the sidebar, in order. Each is an article title.
sidebar_links: [Main Page, The History, Timeline, Glossary, Canon and sources]

# The four browsable categories: category key -> label shown in the sidebar and under titles.
categories:
  history: {label: History, singular: History}
  faction: {label: Factions, singular: Faction}
  character: {label: Characters, singular: Character}
  place: {label: Places, singular: Place}

# Kept out of every generated list, index and backlink. Still reachable by URL, redirects and search.
hidden: [Vesk Tolloran]

# No generated feature may join two of these (handoff brief, "No automatic links between the Union articles").
quarantine:
  - Orson Krennic
  - The Republic Remade
  - The Secessions
  - The Greater Seswenna Union
  - Dedra Meero
  - Thrawn
  - Deran Kolt
  - Eriadu

# Display labels for infobox keys. A pair gives [singular, plural]; the plural is used for a list
# with more than one item. Keys not listed here are shown with their underscores turned into spaces.
labels:
  name: Full name
  also_known_as: Also known as
  designation: Designation
  species: Species
  model: Model
  homeworld: Homeworld
  born: Born
  died: Died
  affiliation: Affiliation
  position: Position
  formerly: Formerly
  senate_stance: Senate stance
  schism_camp: Schism camp
  type: Type
  founded: Founded
  founder: [Founder, Founders]
  leader: [Leader, Leaders]
  seat: Seat
  territory: Territory
  strength: Strength
  affiliated_with: Affiliated with
  predecessor: Predecessor
  status: Status
  date: Date
  place: Place
  participants: Participants
  key_figures: Key figures
  drafted_by: Drafted by
  carried_by: Carried by
  result: Result
  losses: Losses
  preceded_by: Preceded by
  followed_by: Followed by
  region: Region
  sector: Sector
  held_by: Held by
  population: Population
  locations: Locations

# Where the "Canon" tag beside a Background heading points.
canon_link: "Canon and sources#How the articles use canon"

# Artwork credits. An image whose artwork_author is empty is credited to this name, with no link,
# because most uncredited images are official Star Wars art.
default_artwork_author: Lucasfilm and Disney
# Images whose artist is genuinely unknown: credited with the label below instead of the default above.
unknown_artist_images: [ilai-vess.jpg]
unknown_artist_label: unknown artist

# The notice a visitor must acknowledge before entering the wiki. Once acknowledged it is remembered
# in that browser. Raise `version` after changing the text, so returning visitors see it again.
# show_on: "all" shows it on whichever page a new visitor opens first; "main" only on the Main Page.
# Paragraphs may use Markdown, for example [a link](https://example.com) or [[Article title]].
disclaimer:
  version: 1
  show_on: all
  title: Before you enter
  paragraphs:
    - >-
      The Low Republic is a non-commercial fan work. It is not affiliated with, endorsed by or
      connected to Lucasfilm or Disney.
    - >-
      Star Wars and all related names, characters and properties are owned by Lucasfilm and Disney.
      All other copyrighted material on this site remains the property of its respective authors.
    - >-
      All artwork has been credited to its artist wherever possible. If you are the author of an
      artwork shown here and wish it altered or removed, please contact the owner of this wiki.
  # How to reach the owner, shown under the paragraphs when filled in (Markdown allowed).
  contact: ""
  button: Acknowledge
